<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; min-height: 100vh; margin: 0; background: #f0f4f8; }
        .panel { margin: auto; width: 100%; max-width: 420px; background: white; border-radius: 14px; box-shadow: 0 18px 50px rgba(20, 30, 80, 0.12); padding: 36px; }
        h1 { margin-top: 0; font-size: 28px; color: #1f2937; }
        .subtitle { color: #4b5563; margin-bottom: 24px; }
        .field { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #374151; font-size: 14px; }
        input { width: 100%; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 15px; }
        button { width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 10px; background: #2563eb; color: white; font-size: 16px; cursor: pointer; }
        .message { margin-bottom: 18px; padding: 12px 14px; border-radius: 10px; background: #eef2ff; color: #1d4ed8; }
        .error { background: #fee2e2; color: #991b1b; }
        .footer { margin-top: 24px; color: #6b7280; font-size: 13px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Sign in</h1>
        <p class="subtitle">Login to your account.</p>
        {% if messages %}
            {% for message in messages %}
                <div class="message{% if message.tags %} {{ message.tags }}{% endif %}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="admin" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="········" required>
            </div>
            <button type="submit">Log in</button>
        </form>
        <p class="footer">This is the login page.</p>
    </div>
</body>
</html>
